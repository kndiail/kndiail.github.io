<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>生日贺卡 · 给舅舅</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    font-family: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Segoe UI", sans-serif;
    background:
      radial-gradient(ellipse at 50% 115%, #1b2a5e 0%, transparent 62%),
      linear-gradient(180deg, #020312 0%, #060b26 40%, #101b45 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: auto;
    color: #fff;
    text-align: center;
    -webkit-user-select: none;
    user-select: none;
  }

  /* ---------- 星空 ---------- */
  .stars { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
  .star {
    position: absolute;
    background: #fff;
    border-radius: 50%;
    opacity: .6;
    animation: twinkle 2.4s ease-in-out infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: .15; transform: scale(.8); }
    50%      { opacity: 1;   transform: scale(1.15); }
  }

  /* ---------- 流星 ---------- */
  .meteor {
    position: fixed;
    width: 3px; height: 3px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 8px 3px rgba(170, 205, 255, .75);
    opacity: 0;
    z-index: 0;
    pointer-events: none;
    animation: meteorFall linear infinite;
  }
  .meteor::before {
    content: '';
    position: absolute;
    right: 0; top: 50%;
    margin-top: -1px;
    width: 230px; height: 2px;
    border-radius: 2px;
    background: linear-gradient(to left, rgba(255,255,255,.95), rgba(150,190,255,.35) 55%, transparent);
    transform-origin: right center;
    transform: rotate(45deg);
  }
  @keyframes meteorFall {
    0%   { transform: translate(0, 0); opacity: 0; }
    4%   { opacity: 1; }
    14%  { opacity: 1; }
    22%  { opacity: 0; }
    100% { transform: translate(var(--tx), var(--ty)); opacity: 0; }
  }
  .m1 { left: 10%; top: 12%;  --tx: 88vw;  --ty: 84vh; animation-duration: 9s;    animation-delay: 1.2s; }
  .m2 { left: 55%; top: 5%;   --tx: 70vw;  --ty: 88vh; animation-duration: 12s;   animation-delay: 5.5s; }
  .m3 { left: 30%; top: 22%;  --tx: 95vw;  --ty: 90vh; animation-duration: 10.5s; animation-delay: 8s; }
  .m4 { left: 75%; top: 18%;  --tx: 60vw;  --ty: 92vh; animation-duration: 13s;   animation-delay: 3.5s; }
  .m5 { left: -5%; top: 40%;  --tx: 105vw; --ty: 78vh; animation-duration: 11s;   animation-delay: 10s; }

  /* ---------- 气球 ---------- */
  .balloons { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
  .balloon {
    position: absolute;
    bottom: -180px;
    width: 72px;
    height: 92px;
    border-radius: 50% 50% 50% 50% / 44% 44% 56% 56%;
    animation: floatUp linear infinite;
  }
  .balloon::before {
    content: '';
    position: absolute;
    left: 16px; top: 16px;
    width: 14px; height: 24px;
    background: rgba(255,255,255,.45);
    border-radius: 50%;
    transform: rotate(-22deg);
  }
  .balloon::after {
    content: '';
    position: absolute;
    left: 50%; top: 100%;
    width: 2px; height: 90px;
    background: rgba(255,255,255,.4);
  }
  .b1 { left: 6%;  background: linear-gradient(135deg, #ffb3c1, #ff5d8f); animation-duration: 13s; animation-delay: -6s; }
  .b2 { left: 20%; background: linear-gradient(135deg, #ffe29f, #ffb703); animation-duration: 16s; animation-delay: -2s; transform: scale(.8); }
  .b3 { left: 42%; background: linear-gradient(135deg, #a9def9, #4cc9f0); animation-duration: 14s; animation-delay: -9s; }
  .b4 { left: 66%; background: linear-gradient(135deg, #e0c3fc, #8b5cf6); animation-duration: 17s; animation-delay: -4s; transform: scale(.85); }
  .b5 { left: 86%; background: linear-gradient(135deg, #b9fbc0, #2ec4b6); animation-duration: 15s; animation-delay: -11s; }
  @keyframes floatUp {
    0%   { transform: translateY(0) rotate(-4deg); }
    50%  { transform: translateY(-55vh) rotate(4deg); }
    100% { transform: translateY(-115vh) rotate(-3deg); }
  }

  /* ---------- 特效画布（彩带/烟花） ---------- */
  #fx { position: fixed; inset: 0; pointer-events: none; z-index: 10; }

  /* ---------- 贺卡 ---------- */
  .card {
    position: relative;
    z-index: 2;
    width: min(680px, 92vw);
    margin: 30px auto;
    padding: 44px 30px 40px;
    background: rgba(13, 20, 50, .55);
    border: 1px solid rgba(140, 170, 255, .28);
    border-radius: 26px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 24px 60px rgba(0, 0, 0, .5);
    animation: cardIn 1s cubic-bezier(.2, .9, .3, 1.15) both;
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(46px) scale(.94); }
    to   { opacity: 1; transform: none; }
  }

  h1 {
    font-size: clamp(1.5rem, 5.5vw, 2.3rem);
    letter-spacing: .03em;
    background: linear-gradient(90deg, #ffe29f, #ffd166, #ff8fab, #7bdff2, #ffe29f);
    background-size: 300% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shine 6s linear infinite, riseIn .9s ease .15s both;
  }
  @keyframes shine { to { background-position: 300% 0; } }

  h2 {
    margin-top: 10px;
    font-size: clamp(1.2rem, 4.6vw, 1.9rem);
    font-weight: 600;
    letter-spacing: .1em;
    opacity: 0;
    animation: riseIn .9s ease .4s forwards;
  }

  .todayline {
    margin-top: 8px;
    font-size: .92rem;
    color: #cfe0ff;
    opacity: 0;
    animation: riseIn .9s ease .55s forwards;
  }

  @keyframes riseIn {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: none; }
  }

  .wish { margin-top: 22px; }
  .wish p {
    margin: 9px 0;
    font-size: clamp(1rem, 3.4vw, 1.15rem);
    color: #e8efff;
    opacity: 0;
    transform: translateY(14px);
    animation: riseIn .9s ease forwards;
  }
  .wish p:nth-child(1) { animation-delay: .7s; }
  .wish p:nth-child(2) { animation-delay: 1s; }
  .wish p:nth-child(3) { animation-delay: 1.3s; }

  /* ---------- 蛋糕 ---------- */
  .cake-zone {
    position: relative;
    width: 280px;
    height: 250px;
    margin: 30px auto 6px;
    opacity: 0;
    animation: riseIn 1s ease 1.4s forwards;
  }
  .cake {
    position: relative;
    width: 280px;
    height: 250px;
    cursor: pointer;
  }
  .cake.wobble { animation: cakeWobble .55s ease; }
  @keyframes cakeWobble {
    0%, 100% { transform: rotate(0); }
    15% { transform: rotate(-5deg); }
    35% { transform: rotate(5deg); }
    55% { transform: rotate(-3deg); }
    75% { transform: rotate(2deg); }
  }
  .plate {
    position: absolute;
    bottom: 8px; left: 50%;
    transform: translateX(-50%);
    width: 272px; height: 20px;
    border-radius: 50%;
    background: linear-gradient(#f8f9fa, #c3ccd8);
    box-shadow: 0 6px 14px rgba(0,0,0,.25);
  }
  .tier { position: absolute; left: 50%; transform: translateX(-50%); border-radius: 14px; }
  .tier.bottom {
    bottom: 26px;
    width: 232px; height: 74px;
    background:
      repeating-linear-gradient(90deg, rgba(255,255,255,.32) 0 5px, transparent 5px 20px),
      linear-gradient(#ffb3c1, #ff6d9b);
    box-shadow: inset 0 -14px 0 rgba(0,0,0,.10);
  }
  .tier.top {
    bottom: 100px;
    width: 142px; height: 72px;
    background:
      repeating-linear-gradient(90deg, rgba(255,255,255,.30) 0 4px, transparent 4px 16px),
      linear-gradient(#fff3d9, #ffd98a);
    box-shadow: inset 0 -12px 0 rgba(0,0,0,.08);
  }
  .candles {
    position: absolute;
    bottom: 172px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 24px;
  }
  .candle {
    position: relative;
    width: 12px; height: 54px;
    border-radius: 4px;
    background: repeating-linear-gradient(45deg, #ffffff 0 5px, #ff5d8f 5px 10px);
    box-shadow: 0 3px 6px rgba(0,0,0,.18);
  }
  .candle::before {
    content: '';
    position: absolute;
    top: -8px; left: 50%;
    width: 2px; height: 8px;
    background: #5b4a3a;
    transform: translateX(-50%);
  }
  .flame {
    position: absolute;
    top: -24px; left: 50%;
    margin-left: -6px;
    width: 12px; height: 18px;
    border-radius: 50% 50% 50% 50% / 62% 62% 38% 38%;
    background: radial-gradient(circle at 50% 72%, #fff7ae, #ffb703 55%, #fb8500 90%);
    box-shadow: 0 0 14px 5px rgba(255, 183, 3, .65);
    transform-origin: 50% 100%;
    animation: flicker .16s ease-in-out infinite alternate;
  }
  @keyframes flicker {
    0%   { transform: scaleY(1)    rotate(-2.5deg); }
    100% { transform: scaleY(1.18) rotate(2.5deg); }
  }
  .cake.out .flame {
    animation: none;
    opacity: 0;
    transform: scale(.3);
    transition: opacity .4s ease, transform .4s ease;
  }

  .smoke {
    position: absolute;
    width: 16px; height: 16px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(224,224,238,.85) 0%, rgba(224,224,238,0) 70%);
    pointer-events: none;
    z-index: 5;
    animation: puff 1.5s ease-out forwards;
  }
  @keyframes puff {
    0%   { transform: translate(0, 0) scale(.5);  opacity: .95; }
    100% { transform: translate(var(--dx, 10px), -62px) scale(2.4); opacity: 0; }
  }

  .msg {
    min-height: 1.7em;
    margin-top: 16px;
    font-size: 1.1rem;
    font-weight: 600;
    color: #ffe29f;
  }

  /* ---------- 按钮 ---------- */
  .buttons {
    display: flex;
    gap: 14px;
    justify-content: center;
    flex-wrap: wrap;
    margin-top: 22px;
    opacity: 0;
    animation: riseIn .9s ease 1.7s forwards;
  }
  button {
    font: inherit;
    font-size: 1rem;
    font-weight: 600;
    padding: 13px 24px;
    border: none;
    border-radius: 999px;
    cursor: pointer;
    color: #5b2333;
    background: linear-gradient(135deg, #ffe29f, #ffd166);
    box-shadow: 0 6px 16px rgba(0, 0, 0, .28);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  button:hover  { transform: translateY(-2px) scale(1.04); box-shadow: 0 10px 22px rgba(0,0,0,.35); }
  button:active { transform: translateY(0) scale(.96); }
  #btnFirework { color: #123c63; background: linear-gradient(135deg, #c4e0ff, #7db8ff); }
  #btnWish, #btnDraw { font-size: .92rem; padding: 11px 18px; }

  /* ---------- 礼物盒 ---------- */
  .extras {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: flex-start;
    gap: 18px 44px;
    margin-top: 26px;
  }
  .gift {
    position: relative;
    width: 140px;
    height: 150px;
    cursor: pointer;
    opacity: 0;
    animation: riseIn .9s ease 1.95s forwards;
  }
  .gift-box {
    position: absolute;
    bottom: 22px; left: 50%;
    transform: translateX(-50%);
    width: 96px; height: 62px;
    border-radius: 8px;
    background: linear-gradient(#ff8fab, #ff5d8f);
    box-shadow: 0 8px 18px rgba(0,0,0,.35);
  }
  .gift-box::before {
    content: '';
    position: absolute; top: 0; bottom: 0; left: 50%;
    width: 14px; margin-left: -7px;
    background: linear-gradient(#fff0d4, #ffd166);
  }
  .gift-lid {
    position: absolute;
    top: 26px; left: 50%;
    transform: translateX(-50%);
    width: 108px; height: 26px;
    border-radius: 6px;
    background: linear-gradient(#ffb3c1, #ff6d9b);
    box-shadow: 0 4px 10px rgba(0,0,0,.25);
    transition: transform .55s cubic-bezier(.3,.8,.4,1.2), opacity .3s;
    z-index: 2;
  }
  .gift-lid::before {
    content: '';
    position: absolute; top: 0; bottom: 0; left: 50%;
    width: 16px; margin-left: -8px;
    background: linear-gradient(#fff0d4, #ffd166);
  }
  .gift::before, .gift::after { /* 蝴蝶结 */
    content: '';
    position: absolute; top: 18px; z-index: 3;
    width: 22px; height: 17px;
    border-radius: 50% 50% 40% 40%;
    background: radial-gradient(circle at 40% 35%, #fff7ae, #ffd166 75%);
    box-shadow: 0 2px 6px rgba(0,0,0,.2);
  }
  .gift::before { left: 50%; margin-left: -22px; transform: rotate(-28deg); }
  .gift::after  { left: 50%; margin-left: -2px;  transform: rotate(28deg); }
  .gift.open .gift-lid { transform: translate(-18px, -54px) rotate(-30deg); opacity: .95; }
  .gift-heart {
    position: absolute; left: 50%; top: 52px;
    transform: translateX(-50%);
    font-size: 1.7rem;
    opacity: 0;
    z-index: 1;
    transition: opacity .4s, transform .4s;
  }
  .gift.open .gift-heart {
    opacity: 1;
    animation: heartBeat 1.1s ease-in-out .3s infinite;
  }
  @keyframes heartBeat {
    0%, 100% { transform: translateX(-50%) scale(1); }
    50%      { transform: translateX(-50%) scale(1.22); }
  }
  .gift-msg {
    position: absolute;
    top: -34px; left: 50%;
    transform: translateX(-50%);
    width: 180px;
    font-size: .84rem;
    line-height: 1.5;
    color: #ffe29f;
    opacity: 0;
    transition: opacity .5s ease .15s;
  }
  .gift.open .gift-msg { opacity: 1; }
  .gift-label {
    position: absolute;
    bottom: 0; left: 0; width: 100%;
    font-size: .8rem;
    color: rgba(255,255,255,.75);
  }

  /* ---------- 生日签 ---------- */
  .draw { opacity: 0; animation: riseIn .9s ease 2.1s forwards; }
  .draw-card {
    width: 180px; height: 112px;
    margin: 12px auto 0;
    perspective: 700px;
  }
  .draw-inner {
    position: relative;
    width: 100%; height: 100%;
    transform-style: preserve-3d;
    transition: transform .55s cubic-bezier(.4,.2,.2,1);
  }
  .draw-card.flipped .draw-inner { transform: rotateY(180deg); }
  .draw-front, .draw-back {
    position: absolute; inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 12px;
    box-shadow: 0 10px 24px rgba(0,0,0,.3);
  }
  .draw-front {
    background: linear-gradient(135deg, #7db8ff, #4cc9f0);
    color: #0b2545;
    font-weight: 700;
    font-size: 1.05rem;
    letter-spacing: .12em;
  }
  .draw-back {
    background: linear-gradient(135deg, #ffe29f, #ffd166);
    color: #5b2333;
    font-size: .9rem;
    line-height: 1.55;
    transform: rotateY(180deg);
  }

  /* ---------- 许愿星 ---------- */
  .wish-form {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
    margin-top: 22px;
    opacity: 0;
    animation: riseIn .9s ease 2.25s forwards;
  }
  .wish-form input {
    flex: 1 1 220px;
    max-width: 300px;
    padding: 12px 18px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,.3);
    background: rgba(255,255,255,.1);
    color: #fff;
    font: inherit;
    font-size: .95rem;
    outline: none;
    transition: border-color .2s, background .2s;
  }
  .wish-form input::placeholder { color: rgba(255,255,255,.55); }
  .wish-form input:focus { border-color: rgba(255, 225, 159, .8); background: rgba(255,255,255,.14); }
  .wish-note {
    margin-top: 12px;
    min-height: 1.5em;
    font-size: .92rem;
    color: #ffe29f;
    opacity: 0;
    animation: riseIn .9s ease 2.35s forwards;
  }
  .wish-star {
    position: fixed;
    z-index: 20;
    max-width: 70vw;
    padding: 6px 16px;
    border-radius: 999px;
    background: radial-gradient(circle at 50% 30%, #fff7ae, #ffd166 70%);
    color: #5b2333;
    font-size: .9rem;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    box-shadow: 0 0 18px 4px rgba(255, 215, 120, .6);
    pointer-events: none;
    animation: wishRise 4.5s ease-out forwards;
  }
  @keyframes wishRise {
    0%   { transform: translate(0, 0) scale(1); opacity: 0; }
    8%   { opacity: 1; }
    55%  { opacity: 1; }
    100% { transform: translate(var(--wx), var(--wy)) scale(.12); opacity: 0; }
  }

  /* ---------- 网易云播放器 ---------- */
  .player {
    width: min(340px, 88%);
    margin: 24px auto 0;
    border-radius: 12px;
    overflow: hidden;
    background: rgba(255, 255, 255, .06);
    border: 1px solid rgba(255, 255, 255, .15);
    opacity: 0;
    animation: riseIn .9s ease 2.4s forwards;
  }
  .player iframe { display: block; width: 100%; height: 66px; border: 0; }
  .tip {
    margin-top: 14px;
    font-size: .95rem;
    line-height: 1.6;
    opacity: .8;
    letter-spacing: .02em;
    opacity: 0;
    animation: riseIn .9s ease 2.55s forwards;
  }

  .footer {
    margin-top: 24px;
    font-size: .9rem;
    line-height: 1.8;
    opacity: .88;
    letter-spacing: .02em;
    opacity: 0;
    animation: riseIn 1s ease 2.7s forwards;
  }

  @media (max-width: 480px) {
    .cake { transform: scale(.82); }
    .cake-zone { width: 230px; height: 205px; }
    .card { padding: 32px 16px 32px; }
  }
</style>
</head>
<body>

  <div class="stars" id="stars"></div>
  <div class="meteor m1"></div>
  <div class="meteor m2"></div>
  <div class="meteor m3"></div>
  <div class="meteor m4"></div>
  <div class="meteor m5"></div>
  <div class="balloons">
    <div class="balloon b1"></div>
    <div class="balloon b2"></div>
    <div class="balloon b3"></div>
    <div class="balloon b4"></div>
    <div class="balloon b5"></div>
  </div>
  <canvas id="fx"></canvas>

  <main class="card">
    <h1>祝我全天下最nb的舅舅生日快乐</h1>
    <h2>给舅舅的小小心意</h2>
    <p class="todayline" id="todayLine"></p>

    <div class="wish">
      <p>祝我舅升职加薪年入千万，早日跻身福布斯世界富豪排行榜</p>
      <p>祝我舅永远不死，健康常伴</p>
      <p>祝我舅诸事顺遂</p>
    </div>

    <div class="cake-zone">
      <div class="cake" id="cake" title="点蛋糕会弹哦">
        <div class="candles">
          <div class="candle"><span class="flame"></span></div>
          <div class="candle"><span class="flame"></span></div>
          <div class="candle"><span class="flame"></span></div>
          <div class="candle"><span class="flame"></span></div>
          <div class="candle"><span class="flame"></span></div>
        </div>
        <div class="tier top"></div>
        <div class="tier bottom"></div>
        <div class="plate"></div>
      </div>
    </div>

    <p class="msg" id="msg"></p>

    <div class="buttons">
      <button id="btnBlow">点击这个按钮吹灭蜡烛</button>
      <button id="btnFirework">🎆 放烟花</button>
    </div>

    <div class="extras">
      <div class="gift" id="gift" title="点我拆礼物">
        <p class="gift-msg">拆开啦！最好的礼物是您身体健康、天天开心</p>
        <div class="gift-lid"></div>
        <div class="gift-box"></div>
        <div class="gift-heart">💖</div>
        <p class="gift-label">🎁 拆礼物</p>
      </div>

      <div class="draw">
        <button id="btnDraw">抽一张生日签</button>
        <div class="draw-card" id="drawCard">
          <div class="draw-inner">
            <div class="draw-front">🎋 生日签</div>
            <div class="draw-back" id="drawText"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="wish-form">
      <input id="wishInput" type="text" maxlength="20" placeholder="写个愿望，它会变成星星飞上天" autocomplete="off" />
      <button id="btnWish">把愿望写上去</button>
    </div>
    <p class="wish-note" id="wishNote"></p>

    <!-- 网易云音乐播放器：想换歌就把 src 里的 id= 改成对应歌曲ID即可 -->
    <div class="player">
      <iframe
        frameborder="no" border="0" marginwidth="0" marginheight="0"
        src="https://music.163.com/outchain/player?type=2&id=1417454592&auto=0&height=66"
        title="网易云音乐 - 生日快乐" allow="autoplay"></iframe>
    </div>
    <p class="tip">我不会做自动播放，这个点一下就能放生日歌了</p>

    <p class="footer">外甥敬上，今天真的忘了你过生日了，显然准备实体礼物已经来不及了所以做了这个小网页祝福一下😋</p>
  </main>

<script>
(function () {
  'use strict';

  /* ============ 今天日期 ============ */
  (function () {
    var d = new Date();
    var el = document.getElementById('todayLine');
    if (el) el.textContent = '今天是 ' + (d.getMonth() + 1) + '月' + d.getDate() + '日，您的主场';
  })();

  /* ============ 星空 ============ */
  var stars = document.getElementById('stars');
  for (var i = 0; i < 90; i++) {
    var s = document.createElement('div');
    s.className = 'star';
    s.style.left = (Math.random() * 100) + '%';
    s.style.top = (Math.random() * 100) + '%';
    var size = (Math.random() * 2.5 + 1).toFixed(1);
    s.style.width = size + 'px';
    s.style.height = size + 'px';
    s.style.animationDelay = (Math.random() * 3) + 's';
    s.style.animationDuration = (Math.random() * 2.5 + 2) + 's';
    stars.appendChild(s);
  }

  /* ============ 画布：彩带 + 烟花 ============ */
  var canvas = document.getElementById('fx');
  var ctx2d = canvas.getContext('2d');
  var W = innerWidth, H = innerHeight;

  function resize() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx2d.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);

  var COLORS = ['#ffd166', '#ff8fab', '#7bdff2', '#a9def9', '#ffe29f', '#c084fc', '#5ee6a8', '#ff5d8f'];
  var parts = [];
  var rockets = [];

  function makePart(x, y, burst) {
    var angle = burst ? Math.random() * Math.PI * 2 : Math.PI / 2 + (Math.random() - 0.5) * 0.6;
    var speed = burst ? 3 + Math.random() * 7 : 1 + Math.random() * 2.2;
    return {
      x: x, y: y,
      vx: Math.cos(angle) * speed,
      vy: burst ? Math.sin(angle) * speed - 4.5 : Math.sin(angle) * speed,
      g: burst ? 0.22 : 0.012,
      w: 6 + Math.random() * 7,
      h: 8 + Math.random() * 8,
      rot: Math.random() * Math.PI,
      vr: (Math.random() - 0.5) * 0.25,
      color: COLORS[(Math.random() * COLORS.length) | 0],
      life: 1,
      fade: burst ? 0.007 + Math.random() * 0.012 : 0,
      sway: Math.random() * Math.PI * 2,
      swaySpeed: 0.02 + Math.random() * 0.03,
      circle: false,
      glow: false
    };
  }

  function makeSpark(x, y) {
    var angle = Math.random() * Math.PI * 2;
    var speed = 2 + Math.random() * 5.5;
    return {
      x: x, y: y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 1,
      g: 0.09,
      w: 3 + Math.random() * 3.5,
      h: 3 + Math.random() * 3.5,
      rot: 0, vr: 0,
      color: COLORS[(Math.random() * COLORS.length) | 0],
      life: 1,
      fade: 0.006 + Math.random() * 0.012,
      sway: 0, swaySpeed: 0,
      circle: true,
      glow: true
    };
  }

  function explode(x, y) {
    var n = 46 + (Math.random() * 26 | 0);
    for (var i = 0; i < n; i++) {
      if (parts.length > 900) break;
      parts.push(makeSpark(x, y));
    }
  }

  function launchRocket(tx, ty) {
    rockets.push({
      x: W * (0.18 + Math.random() * 0.64),
      y: H + 12,
      tx: tx, ty: ty,
      trail: [],
      speed: 7 + Math.random() * 4
    });
  }

  function spawnBurst(x, y, n) {
    for (var i = 0; i < n; i++) parts.push(makePart(x, y, true));
  }

  function tick() {
    ctx2d.clearRect(0, 0, W, H);
    if (parts.length < 260 && Math.random() < 0.14) {
      parts.push(makePart(Math.random() * W, -20, false));
    }
    for (var i = parts.length - 1; i >= 0; i--) {
      var p = parts[i];
      p.vy += p.g;
      if (p.swaySpeed) { p.sway += p.swaySpeed; p.x += Math.sin(p.sway) * 1.1; }
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.vr;
      if (p.fade > 0) p.life -= p.fade;
      if (p.y > H + 30 || p.x < -40 || p.x > W + 40 || p.life <= 0) {
        parts.splice(i, 1);
        continue;
      }
      var a0 = p.fade > 0 ? Math.max(p.life, 0) : Math.min(1, 1 - (p.y / H) * 0.4 + 0.4);
      ctx2d.save();
      ctx2d.translate(p.x, p.y);
      ctx2d.globalAlpha = a0;
      ctx2d.fillStyle = p.color;
      if (p.circle) {
        ctx2d.beginPath();
        ctx2d.arc(0, 0, p.w / 2, 0, 7);
        ctx2d.fill();
        if (p.glow) {
          ctx2d.globalAlpha = a0 * 0.28;
          ctx2d.beginPath();
          ctx2d.arc(0, 0, p.w * 1.9, 0, 7);
          ctx2d.fill();
        }
      } else {
        ctx2d.rotate(p.rot);
        ctx2d.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      }
      ctx2d.restore();
    }

    /* 烟花火箭（带拖尾） */
    for (var j = rockets.length - 1; j >= 0; j--) {
      var r = rockets[j];
      var dx = r.tx - r.x, dy = r.ty - r.y;
      var dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < 14) {
        explode(r.x, r.y);
        rockets.splice(j, 1);
        continue;
      }
      var step = Math.min(r.speed, dist);
      r.x += dx / dist * step;
      r.y += dy / dist * step;
      r.trail.push({ x: r.x, y: r.y });
      if (r.trail.length > 16) r.trail.shift();
      for (var k = 0; k < r.trail.length; k++) {
        var t = r.trail[k];
        ctx2d.globalAlpha = (k / r.trail.length) * 0.45;
        ctx2d.fillStyle = '#fff';
        ctx2d.beginPath();
        ctx2d.arc(t.x, t.y, 1.4, 0, 7);
        ctx2d.fill();
      }
      ctx2d.globalAlpha = 1;
      ctx2d.fillStyle = '#fff7ae';
      ctx2d.beginPath();
      ctx2d.arc(r.x, r.y, 2.6, 0, 7);
      ctx2d.fill();
    }

    ctx2d.globalAlpha = 1;
    requestAnimationFrame(tick);
  }
  tick();

  /* ============ 点空白处放烟花 ============ */
  document.addEventListener('click', function (e) {
    var t = e.target;
    if (t.closest && t.closest('button, .gift, .cake, .draw-card, .wish-form, .player, a, input')) return;
    launchRocket(e.clientX, e.clientY);
  });

  /* ============ 放烟花按钮 + 开场礼花 ============ */
  document.getElementById('btnFirework').addEventListener('click', function () {
    for (var i = 0; i < 4; i++) {
      (function (n) {
        setTimeout(function () {
          launchRocket(W * (0.2 + Math.random() * 0.6), H * (0.12 + Math.random() * 0.28));
        }, n * 280);
      })(i);
    }
  });
  setTimeout(function () { launchRocket(W * 0.32, H * 0.24); }, 2600);
  setTimeout(function () { launchRocket(W * 0.68, H * 0.2); }, 3400);

  /* ============ 吹蜡烛 ============ */
  var cake = document.getElementById('cake');
  var msg = document.getElementById('msg');
  var btnBlow = document.getElementById('btnBlow');
  var blown = false;

  function puff(x, y) {
    var s = document.createElement('div');
    s.className = 'smoke';
    s.style.left = x + 'px';
    s.style.top = y + 'px';
    var sz = (12 + Math.random() * 16).toFixed(0);
    s.style.width = sz + 'px';
    s.style.height = sz + 'px';
    s.style.setProperty('--dx', (Math.random() * 44 - 22).toFixed(0) + 'px');
    cake.appendChild(s);
    setTimeout(function () { s.remove(); }, 1600);
  }

  btnBlow.addEventListener('click', function () {
    if (!blown) {
      blown = true;
      cake.classList.add('out');
      var candleEls = cake.querySelectorAll('.candle');
      var cakeRect = cake.getBoundingClientRect();
      for (var i = 0; i < candleEls.length; i++) {
        (function (el, idx) {
          var r = el.getBoundingClientRect();
          var x = r.left - cakeRect.left + r.width / 2;
          var y = r.top - cakeRect.top + r.height / 2;
          setTimeout(function () { puff(x, y); }, idx * 130);
        })(candleEls[i], i);
      }
      msg.textContent = '许愿成功！剩下的交给时间';
      btnBlow.textContent = '再放一次礼花';
      setTimeout(function () {
        spawnBurst(W / 2, H * 0.42, 170);
      }, 600);
    } else {
      spawnBurst(W / 2, H * 0.42, 170);
    }
  });

  /* ============ 点蛋糕：弹一弹 ============ */
  cake.addEventListener('click', function () {
    cake.classList.remove('wobble');
    void cake.offsetWidth;
    cake.classList.add('wobble');
    var r = cake.getBoundingClientRect();
    spawnBurst(r.left + r.width / 2, r.top + r.height * 0.35, 26);
  });

  /* ============ 拆礼物 ============ */
  var gift = document.getElementById('gift');
  var giftOpened = false;
  gift.addEventListener('click', function () {
    var r = gift.getBoundingClientRect();
    if (!giftOpened) {
      giftOpened = true;
      gift.classList.add('open');
      spawnBurst(r.left + r.width / 2, r.top + r.height / 2, 70);
      setTimeout(function () {
        spawnBurst(r.left + r.width / 2, r.top + r.height * 0.4, 40);
      }, 260);
    } else {
      spawnBurst(r.left + r.width / 2, r.top + r.height / 2, 50);
    }
  });

  /* ============ 抽生日签 ============ */
  var DRAWS = [
    '今日运势：舅舅最大，谁都得让着您',
    '财神爷今天放假，改请您代班',
    '宜：吃蛋糕、收祝福、发红包',
    '忌：跟晚辈客气，尤其是这一顿',
    '好运已加载 100%，今天生效',
    '寿星特权：今天您说了算',
    '烦恼自动清零，快乐 +1 年',
    '大声说三遍：我又年轻了一岁'
  ];
  var drawCard = document.getElementById('drawCard');
  var drawText = document.getElementById('drawText');
  var drawFlipped = false;
  var lastDraw = -1;
  document.getElementById('btnDraw').addEventListener('click', function () {
    var idx;
    do { idx = (Math.random() * DRAWS.length) | 0; } while (idx === lastDraw);
    lastDraw = idx;
    if (!drawFlipped) {
      drawFlipped = true;
      drawText.textContent = DRAWS[idx];
      drawCard.classList.add('flipped');
    } else {
      drawCard.classList.remove('flipped');
      setTimeout(function () {
        drawText.textContent = DRAWS[idx];
        drawCard.classList.add('flipped');
      }, 170);
    }
  });

  /* ============ 许愿星 ============ */
  var wishInput = document.getElementById('wishInput');
  var wishNote = document.getElementById('wishNote');
  function sendWish() {
    var text = wishInput.value.trim();
    if (!text) { wishInput.focus(); return; }
    var r = wishInput.getBoundingClientRect();
    var star = document.createElement('div');
    star.className = 'wish-star';
    star.textContent = '⭐ ' + text;
    star.style.left = (r.left + r.width / 2) + 'px';
    star.style.top = r.top + 'px';
    star.style.setProperty('--wx', (Math.random() * 70 - 35).toFixed(0) + 'vw');
    star.style.setProperty('--wy', (-(55 + Math.random() * 25)).toFixed(0) + 'vh');
    document.body.appendChild(star);
    setTimeout(function () { star.remove(); }, 4600);
    spawnBurst(r.left + r.width / 2, r.top, 14);
    wishNote.textContent = '愿望收到，星星已经起飞 ✨';
    wishInput.value = '';
  }
  document.getElementById('btnWish').addEventListener('click', sendWish);
  wishInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') sendWish(); });
})();
</script>
</body>
</html>
